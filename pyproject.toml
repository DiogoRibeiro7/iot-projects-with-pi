[project]
name = "iot-projects-with-pi"
version = "0.1.0"
description = "Reusable Raspberry Pi IoT building blocks and reference projects."
readme = "README.md"
requires-python = ">=3.12,<4.0"
authors = [
    { name = "Diogo Ribeiro" },
]
dependencies = []

[project.optional-dependencies]
hardware = [
    "gpiozero>=2.0.1,<3.0.0",
]
dht = [
    "adafruit-circuitpython-dht>=4.0.9,<5.0.0",
    "adafruit-blinka>=8.67.0,<9.0.0",
]
mqtt = [
    "paho-mqtt>=2.1.0,<3.0.0",
]

[project.scripts]
iot-weather = "iot_pi.weather.cli:main"
iot-home = "iot_pi.home.cli:main"
iot-profile = "iot_pi.profiling.cli:main"
iot-agriculture = "iot_pi.agriculture.cli:main"
iot-health = "iot_pi.observability.cli:main"
iot-device = "iot_pi.device_cli:main"
iot-sqlite = "iot_pi.sqlite_cli:main"
iot-fleet = "iot_pi.fleet_cli:main"
iot-deploy-plan = "iot_pi.deployment_plan_cli:main"

[tool.poetry]
packages = [{ include = "iot_pi", from = "src" }]

[tool.poetry.group.dev.dependencies]
mypy = "^1.18.0"
pre-commit = "^4.3.0"
pytest = "^8.4.0"
pytest-cov = "^7.0.0"
ruff = "^0.13.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["iot_pi"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=iot_pi --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["iot_pi"]
omit = [
    "src/iot_pi/*/cli.py",
    "src/iot_pi/*_cli.py",
    "src/iot_pi/messaging/mqtt.py",
    "src/iot_pi/release.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 90
