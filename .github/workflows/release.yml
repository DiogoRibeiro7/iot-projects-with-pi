name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to validate and release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify tag exists and points to main history
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git fetch origin main --tags
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Check out release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: git checkout --detach "$RELEASE_TAG"

      - name: Set up Python and Poetry
        uses: DiogoRibeiro7/git-actions-collection/.github/actions/setup-poetry@v1.4.0
        with:
          python-version: "3.12"
          install-deps: "false"

      - name: Validate dependency lock
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --all-extras

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff formatting
        run: poetry run ruff format --check .

      - name: mypy
        run: poetry run mypy src

      - name: pytest with coverage
        run: poetry run pytest

      - name: Build artifacts
        run: poetry build

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: poetry run python scripts/validate_release.py --tag "$RELEASE_TAG"

      - name: Generate release provenance
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          release_commit="$(git rev-parse HEAD)"
          build_timestamp="$(date -u +'%Y-%m-%dT%H:%M:%S+00:00')"
          poetry run python scripts/generate_provenance.py \
            --tag "$RELEASE_TAG" \
            --commit-sha "$release_commit" \
            --workflow "$WORKFLOW_NAME" \
            --build-timestamp "$build_timestamp"

      - name: Upload validated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-release-${{ steps.tag.outputs.tag }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/provenance.json
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG"             --verify-tag             --generate-notes             --title "$RELEASE_TAG"             dist/*.whl             dist/*.tar.gz             dist/provenance.json
