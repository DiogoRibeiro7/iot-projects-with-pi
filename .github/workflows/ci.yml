name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python and Poetry
        uses: DiogoRibeiro7/git-actions-collection/.github/actions/setup-poetry@v1.4.0
        with:
          python-version: "3.12"
          install-deps: "false"

      - name: Validate dependency lock
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --all-extras

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff formatting
        run: poetry run ruff format --diff src/iot_pi/release.py

      - name: mypy
        run: poetry run mypy src

      - name: pytest with coverage
        run: poetry run pytest

      - name: Project tests without repository coverage
        run: poetry run pytest --no-cov projects

      - name: Build package
        run: poetry build

      - name: Validate built release artifacts
        shell: bash
        run: |
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as stream:
              print(tomllib.load(stream)["project"]["version"])
          PY
          )"
          poetry run python scripts/validate_release.py --tag "v$version"

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Build documentation
        run: mkdocs build --strict
